name: Build and Push Docker Images

on:
  push:
    branches: [master, main]
    tags:
      - 'v*'
  pull_request:
    branches: [master, main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/set-outlooksignatures

jobs:
  changes:
    runs-on: set-outlooksignatures
    outputs:
      deployer: ${{ steps.filter.outputs.deployer }}
      relay: ${{ steps.filter.outputs.relay }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            deployer:
              - 'sig-deployer/**'
              - 'src_Set-OutlookSignatures/**'
            relay:
              - 'sig-relay/**'

  build-and-push:
    needs: changes
    runs-on: set-outlooksignatures
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        service:
          - name: deployer
            context: .
            dockerfile: sig-deployer/Dockerfile
            change_key: deployer
          - name: relay
            context: .
            dockerfile: sig-relay/Dockerfile
            change_key: relay

    steps:
      - name: Check if build needed
        id: should_build
        run: |
          FORCE="${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/') }}"
          CHANGED="${{ needs.changes.outputs[matrix.service.change_key] }}"
          if [[ "$FORCE" == "true" || "$CHANGED" == "true" ]]; then
            echo "build=true" >> $GITHUB_OUTPUT
          else
            echo "build=false" >> $GITHUB_OUTPUT
            echo "Skipping ${{ matrix.service.name }} — no changes detected"
          fi

      - name: Checkout repository
        if: steps.should_build.outputs.build == 'true'
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        if: steps.should_build.outputs.build == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: steps.should_build.outputs.build == 'true' && github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        if: steps.should_build.outputs.build == 'true'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.service.name }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        if: steps.should_build.outputs.build == 'true'
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.service.context }}
          file: ${{ matrix.service.dockerfile }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service.name }}
          platforms: linux/amd64
