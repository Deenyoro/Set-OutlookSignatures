name: Build and Push Docker Images

# Tag-push driven release workflow.
#
# Images are rebuilt and published ONLY when:
#   1. A tag matching `v*` is pushed  (e.g. v1.2.3, v2026.04.14)
#   2. The workflow is dispatched manually from the Actions UI
#
# Pushes to main no longer trigger a build — cut down on churn, no half-baked
# "latest" images chasing work-in-progress commits. To cut a release:
#     git tag v0.2.0 && git push origin v0.2.0
#
# For a one-off rebuild of the current main tip without tagging, use:
#     Actions tab → Build and Push Docker Images → Run workflow

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/set-outlooksignatures

jobs:
  build-and-push:
    runs-on: set-outlooksignatures
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        service:
          - name: deployer
            dockerfile: sig-deployer/Dockerfile
          - name: relay
            dockerfile: sig-relay/Dockerfile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Docker Hub auth — higher rate limit for any docker.io pull during
      # build. Base images already come via mirror.gcr.io (no rate limit),
      # so this is a safety net for transitive / cache pulls.
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.service.name }}
          # Tags applied to the pushed image:
          #   * semver from the git tag (1.2.3 + 1.2 for v1.2.3)
          #   * short sha (so the exact build is always pinnable)
          #   * latest — updates on every tag push and on manual dispatch
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.service.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service.name }}
          platforms: linux/amd64
