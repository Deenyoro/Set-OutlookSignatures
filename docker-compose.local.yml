x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  sig-deployer:
    build:
      context: .
      dockerfile: sig-deployer/Dockerfile
    container_name: kawasig-deployer
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./templates:/opt/templates:ro
      - deployer-logs:/var/log/sig-deployer
    networks: [signet]
    depends_on: [redis]
    logging: *default-logging
    # PowerShell + .NET can spike during cron runs; give it room.
    mem_limit: ${DEPLOYER_MEM:-1g}
    mem_reservation: 256m
    healthcheck:
      test: ["CMD", "pgrep", "cron"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 180s

  sig-relay:
    build:
      context: .
      dockerfile: sig-relay/Dockerfile
    container_name: kawasig-relay
    restart: unless-stopped
    env_file: .env
    ports:
      - "${RELAY_SMTP_PORT:-25}:25"
    volumes:
      - ./templates:/opt/templates:ro
      - ./sig-relay/certs:/etc/postfix/certs:ro
      - relay-logs:/var/log/sig-relay
    networks: [signet]
    depends_on: [redis]
    logging: *default-logging
    # Milter holds full message body in RAM per concurrent connection.
    # At MAX_MESSAGE_SIZE=150MB with SMTPD_CONN_LIMIT=50 concurrent the
    # worst case is ~7.5GB; default limit is 2GB (plenty for typical
    # ~1-5MB messages × 50 concurrent). Raise via RELAY_MEM in .env if
    # you really do see 150MB attachments at concurrency.
    mem_limit: ${RELAY_MEM:-2g}
    mem_reservation: 256m
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 25 && test -S /var/spool/postfix/milter/sig-milter.sock"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: kawasig-redis
    restart: unless-stopped
    command: redis-server /usr/local/etc/redis/redis.conf
    volumes:
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
      - redis-data:/data
    networks: [signet]
    expose: ["6379"]
    logging: *default-logging
    # Matches maxmemory 64mb in redis.conf, plus a little headroom for RSS.
    mem_limit: 128m
    mem_reservation: 64m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 3s
      retries: 3

volumes:
  deployer-logs:
  relay-logs:
  redis-data:

networks:
  signet:
    driver: bridge
