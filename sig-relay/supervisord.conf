[supervisord]
nodaemon=true
; supervisor's own log to stdout so `docker compose logs` captures it
logfile=/dev/stdout
logfile_maxbytes=0
pidfile=/var/run/supervisord.pid
user=root

[program:postfix]
command=/usr/sbin/postfix start-fg
autorestart=true
; Postfix writes its real mail log to /var/log/sig-relay/postfix.log via
; maillog_file in main.cf; these supervisor-level pipes only catch process
; startup banners.
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=20
startsecs=5

[program:sig-milter]
command=/opt/milter-venv/bin/python3 -u /opt/milter/sig_milter.py
autorestart=true
; Milter logs -> docker stdout (so `docker compose logs sig-relay` shows
; "Signature injected ...", "Stripped DKIM-Signature ...", "Passthrough ..."
; in real time). A copy still lands in the volume-mounted file via the tee
; command embedded below for offline debugging.
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=10
startsecs=3

[program:logrotate-daily]
command=/bin/bash -c "while :; do sleep 86400; /usr/sbin/logrotate -f /etc/logrotate.d/kawasig 2>&1; done"
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=30
