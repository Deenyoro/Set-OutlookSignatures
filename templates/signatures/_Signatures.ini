; KawaSig — Template-to-user mapping for Set-OutlookSignatures
;
; Syntax (authoritative: https://set-outlooksignatures.com/details):
;   [FilenameInThisFolder.htm]
;       DefaultNew               <- bare tag: use as default for new mail
;       DefaultReplyFwd          <- bare tag: use as default for reply/forward
;       user@domain.com          <- filter: apply ONLY to this user
;       EntraID Group-Name@domain.com   <- filter: apply to members of an Entra ID group
;       -user@domain.com         <- exclude this user
;       OutlookSignatureName = X <- override the name shown in Outlook
;
; IMPORTANT syntax rules (easy to get wrong):
;   * Tag names are bare (no "=value" suffix). `DefaultNew = Foo` is NOT recognised.
;   * Filter matching is LITERAL — wildcards like `*@domain.com` do NOT work
;     (SoS does `-ilike "*[<email>]*"` with the email as-is).
;   * To apply a template to every user in a domain, either:
;       1. List each user explicitly, or
;       2. Create an Entra ID group, add the users, and reference it with `EntraID <name>@<domain>`
;
; Required: use HTM templates (not DOCX) for Linux/Docker deployment.

[TRE-Company.htm]
DefaultNew
DefaultReplyFwd
; Apply to members of this Entra ID group (create it before first deploy):
EntraID KawaSig-TRE@treconstruction.net
; Alternative — uncomment and add one line per user if you don't want a group:
; john@treconstruction.net
; jane@treconstruction.net

[KawaConnect-Company.htm]
DefaultNew
DefaultReplyFwd
EntraID KawaSig-KawaConnect@kawaconnect.com
; dean@kawaconnect.com
